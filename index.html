`<p>L’objectiu és fer punts, i per fer-ho només has d’arribar darrere de la línia de l’equip contrari i deixar la pilota a terra.</p>

`<p>La norma més característica del rugbi és que la pilota <b>només es pot passar cap enrere</b>. Si algú la passa cap endavant, o li cau de les mans cap endavant, és un <b>avant</b>.</p>
<div class="cols">
<div class="cbox rv" data-step="1"><div class="ra" data-mode="ok" role="img" aria-label="Animació: quatre jugadors corren cap endavant i es passen la pilota cap enrere, i la pilota va i torna; qui porta la pilota corre més i qui passa frena"></div><p>Com avancem, doncs? Corrent amb la pilota i passant-la ràpid cap als espais. Qui porta la pilota corre més de pressa, i qui acaba de passar frena, però continua avançant a poc a poc i es queda just darrere per tornar a ser una opció de passada: així la pilota pot anar i tornar, sempre cap enrere.</p></div>

{i:"🙌",l:"La touch",k:"Fora del camp",t:"La touch",steps:1,b:
`<p>Quan la pilota o el jugador que la porta surt per aquesta línia, el joc s’atura i es reprèn amb una <b>touch</b>.</p>
<p>La touch és una de les jugades més característiques del rugbi: els jugadors dels dos equips s’alineen en dues files paral·leles i competeixen per recuperar la pilota que es llança entre elles. Els companys poden aixecar un jugador perquè arribi més amunt i pugui agafar-la.</p>
<p>És una jugada que requereix coordinació, comunicació i estratègia, ja que cada equip intenta guanyar la possessió de la pilota per continuar atacant.</p>
<div class="vid vt rv" data-step="1" id="vT">▶ Aquí hi anirà el vídeo de la touch</div>`},
{i:"🫂",l:"La melé",k:"Tornar a començar",t:"La melé",steps:1,b:
`<p>La <b>melé</b> és una de les formes de reprendre el joc en rugbi després d'un avant. Els vuit davanters de cada equip s'ajunten i s'empenyen els uns contra els altres, formant una estructura compacta amb l'objectiu de guanyar la possessió de la pilota.</p>
<p>La pilota s'introdueix pel mig de les dues primeres línies i els jugadors intenten recuperar-la empenyent i utilitzant els peus per fer-la arribar al seu costat.</p>
<div class="vid vt rv" data-step="1" id="vM">▶ Aquí hi anirà el vídeo de la melé</div>`},
{i:"🟨",l:"El respecte",k:"Respecte",t:"El respecte",steps:2,b:
`<p>Amb els placatges i els cops que rebem pot semblar un esport molt agressiu, però tot el contrari: el més important és el <b>respecte</b>. Respecte al rival, als companys i a l’àrbitre. Durant un partit, només el capità o la capitana pot parlar amb l’àrbitre. Si qualsevol altra persona es queixa d’una decisió, l’equip és castigat amb un penal i ha de retrocedir deu metres.</p>
<p>El respecte al rival no s’acaba quan sona el xiulet final. Quan acaba el partit, els equips fan un passadís i aplaudeixen l’equip contrari.</p>
<div class="cols vr rv" data-step="1">
<div class="vid" id="vR1">▶ Aquí hi anirà el primer vídeo del respecte</div>
<div class="vid rv" data-step="2" id="vR2">▶ Aquí hi anirà el segon vídeo del respecte</div>
</div>`},
{i:"🍽️",l:"El 3r temps",k:"Després del xiulet",t:"El 3r temps",steps:2,b:
`<p>El <b>tercer temps</b> és una de les tradicions més especials del rugbi. Quan acaba el partit, els dos equips es reuneixen per compartir una estona junts, independentment del resultat.</p>
<p>És un moment per parlar, menjar i beure alguna cosa, conèixer els jugadors de l’altre equip i celebrar l’esport que comparteixen. No importa qui hagi guanyat o perdut: tothom hi participa.</p>
<p>El tercer temps representa alguns dels valors més importants del rugbi, com el respecte, la companyonia i l’esportivitat. Perquè en el rugbi, el partit acaba al camp, però el bon ambient continua fora d’ell.</p>
<div class="cols vr tt rv" data-step="1">
<div class="vid" id="vH1">▶ Aquí hi anirà el primer vídeo del 3r temps</div>
<div class="vid rv" data-step="2" id="vH2">▶ Aquí hi anirà el segon vídeo del 3r temps</div>
</div>`},
{i:"🤝",l:"L’equip",k:"Junts",t:"L’equip",steps:1,b:
`<p>Tots els esports col·lectius són d’equip, però al rugbi es nota més: no pots fer-ho tot sol. Si l’equip no t’ajuda, no avances. I si tu no l’ajudes, tampoc.</p>
<p>Cadascú depèn dels altres, i per això es creen vincles tan forts, també fora del camp. Això porta a tenir un cercle social molt gran, amb molts plans: partits, sopars, viatges…</p>

  document.getElementById('nx').onclick=goNext;
  sub=(typeof k==='number')?k:0;applySub();
  fitCard();watchFit();
}

var PHOTOS=[
 {src:"fotos/1.jpg",n:"Primera línia"},

// Animacions de "Com s'avança": mode "ok" (pas enrere) i "err" (avant).
var RA={list:[],raf:0,last:null};
function raInit(host){
  var NS='http://www.w3.org/2000/svg',mode=host.getAttribute('data-mode'),X=[585,475,365,255],NUM=[9,10,12,13];
  var Y0=mode==='kick'?[320,345,370,395]:[335,357,379,401]; // al mode de passades cada jugador comença més profund que l'anterior (escalonats), però sense gastar l'espai de la tornada
  // Mode "ok": anada i tornada de la pilota [qui passa, qui rep, moment]; qui porta la pilota corre més i qui acaba de passar frena però continua avançant a poc a poc, en línia recta, per mantenir la distància de l'inici
  var PS=[[0,1,.05],[1,2,.19],[2,3,.33],[3,2,.62],[2,1,.74],[1,0,.86]];
  var VB=175,VC=470,VA=80,TAU=0.03,NT=1000,YT=null; // velocitat normal, amb pilota, després de passar; suavitat del canvi; passos de la taula
  var F=0.07,RUN=190,TK=0.25,FL=0.45,Y13=150; // Y13: on acaba el 13 a l'animació del xut
  var END=1,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 480 280');svg.setAttribute('aria-hidden','true');
  host.appendChild(svg);
  var G=document.createElementNS(NS,'g');G.setAttribute('transform','translate(-96,-56) scale(.8)');svg.appendChild(G); // camp horitzontal, jugadors corren cap amunt
  function mk(tag,at,par){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);(par||G).appendChild(e);return e}
  for(var i=0;i<9;i++)mk('rect',{x:0,y:70+i*40,width:720,height:40,fill:i%2?'#3A853A':'#3F8F3F'});
  mk('line',{x1:0,y1:100,x2:720,y2:100,stroke:'#fff','stroke-width':2});
  var tl=mk('text',{x:420,y:85,'text-anchor':'middle','dominant-baseline':'central','font-size':15,fill:'#fff','font-family':'system-ui,sans-serif'});tl.textContent='Línia de try rival';
  mk('line',{x1:150,y1:410,x2:150,y2:350,stroke:'#fff','stroke-width':2.5,'stroke-linecap':'round'});
  mk('path',{d:'M143 360L150 348L157 360',fill:'none',stroke:'#fff','stroke-width':2.5,'stroke-linecap':'round','stroke-linejoin':'round'});
  var trails=[0,1,2,3].map(function(i){return mk('line',{x1:X[i],y1:Y0[i],x2:X[i],y2:Y0[i],stroke:'#fff','stroke-width':1,'stroke-dasharray':'3 4',opacity:.4})});
  var ring=mk('circle',{r:20,fill:'none',stroke:'#FFD35C','stroke-width':2});
  var bt=mk('polyline',{fill:'none',stroke:'#FFD35C','stroke-width':2,'stroke-dasharray':'5 4','stroke-linecap':'round','stroke-linejoin':'round'});
  var pl=[0,1,2,3].map(function(i){var g=mk('g',{});mk('circle',{r:14,fill:'#2B6CD3',stroke:'#fff','stroke-width':1.5},g);
    var tx=mk('text',{'text-anchor':'middle','dominant-baseline':'central','font-size':16,'font-weight':600,fill:'#fff','font-family':'system-ui,sans-serif'},g);tx.textContent=NUM[i];return g});
  var ball=mk('g',{});mk('ellipse',{rx:6,ry:9,fill:'#8A4B1C',stroke:'#fff','stroke-width':1},ball);mk('line',{x1:0,y1:-4,x2:0,y2:4,stroke:'#fff','stroke-width':1},ball);
  function ease(s){return s<.5?2*s*s:1-Math.pow(-2*s+2,2)/2}
  function st(i,t){var fl=-1,last=0,passed=false;
    for(var k=0;k<PS.length;k++){var t0=PS[k][2];if(t>=t0&&t<t0+F)fl=k;if(t>=t0+F)last=PS[k][1];if(t>=t0&&PS[k][0]===i)passed=true}
    return (fl>=0?PS[fl][1]:last)===i?1:(passed?-1:0)}
  function buildYT(){var dt=1/NT,y=Y0.slice(),v=[VB,VB,VB,VB],T=[[],[],[],[]];
    for(var n=0;n<=NT;n++){var t=n*dt;for(var i=0;i<4;i++){T[i][n]=y[i];var q=st(i,t),vt=q>0?VC:(q<0?VA:VB);v[i]+=(vt-v[i])*Math.min(1,dt/TAU);y[i]-=v[i]*dt}}
    return T}
  function pos(i,t){
    if(mode==='kick'){
      var a=RUN*Math.min(t,TK+FL);
      if(i<3)return{x:X[i],y:Y0[i]-a};
      return{x:X[3],y:Y0[3]+(Y13-Y0[3])*Math.min(t/(TK+FL),1)};
    }
    if(!YT)YT=buildYT();
    var f=Math.min(Math.max(t,0),1)*NT,n=Math.floor(f);
    return{x:X[i],y:n>=NT?YT[i][NT]:YT[i][n]+(YT[i][n+1]-YT[i][n])*(f-n)};
  }
  function hold(i,t){var p=pos(i,t);return{x:p.x,y:p.y-16}}
  function bp(t){
    if(mode==='kick'){
      if(t<TK){var h=hold(0,t);return{x:h.x,y:h.y,z:1,fl:-1,tg:0}}
      if(t<TK+FL){var s=(t-TK)/FL,a=hold(0,TK),e=hold(3,TK+FL);return{x:a.x+(e.x-a.x)*s,y:a.y+(e.y-a.y)*s,z:1+.8*Math.sin(Math.PI*s),fl:0,tg:3}}
      var h3=hold(3,t);return{x:h3.x,y:h3.y,z:1,fl:-1,tg:3};
    }
    var done=0;
    for(var k=0;k<PS.length;k++){
      var pa=PS[k][0],pb=PS[k][1],p0=PS[k][2];
      if(t>=p0&&t<p0+F){var s2=ease((t-p0)/F),a2=hold(pa,t),b2=hold(pb,t);return{x:a2.x+(b2.x-a2.x)*s2,y:a2.y+(b2.y-a2.y)*s2,z:1,fl:k,tg:pb}}
      if(t>=p0+F)done=pb}
    var h2=hold(done,t);return{x:h2.x,y:h2.y,z:1,fl:-1,tg:done}}
  var inst={t:0,k:mode==='kick'?2:1,play:false,render:function(){
    var t=this.t,b=bp(t),i;
    for(i=0;i<4;i++){var p=pos(i,t);pl[i].setAttribute('transform','translate('+p.x+','+p.y+')');trails[i].setAttribute('x2',p.x);trails[i].setAttribute('y2',p.y)}
    var pts=[];for(var s=0;s<=t+1e-6;s+=0.01){var q=bp(s);pts.push(q.x.toFixed(1)+','+q.y.toFixed(1))}pts.push(b.x.toFixed(1)+','+b.y.toFixed(1));bt.setAttribute('points',pts.join(' '));
    ball.setAttribute('transform','translate('+b.x+','+b.y+') scale('+b.z+')');
    var rp=pos(b.tg,t);ring.setAttribute('transform','translate('+rp.x+','+rp.y+')');ring.setAttribute('stroke-dasharray',b.fl>=0?'4 3':'0')},
    end:END,still:reduce,sp:mode==='kick'?0.12:0.1};
  inst.render();RA.list.push(inst);
  host.onclick=function(){if(sub>=inst.k&&!inst.still){inst.t=0;inst.play=true}};
}
function raLoop(ts){
  if(!RA.list.length){RA.raf=0;return}
  var dt=RA.last===null?0:(ts-RA.last)/1000;RA.last=ts;if(dt>.1)dt=.1;
  RA.list.forEach(function(a){if(!a.play)return;a.t+=dt*(a.sp||0.12);if(a.t>=a.end){a.t=a.end;a.play=false}a.render()});
  RA.raf=requestAnimationFrame(raLoop)}
function raStop(){RA.list=[];RA.last=null;if(RA.raf){cancelAnimationFrame(RA.raf);RA.raf=0}}
function raSync(){RA.list.forEach(function(a){
  if(sub<a.k){a.t=0;a.play=false}
  else if(sub>a.k||a.still){a.t=a.end;a.play=false}
  else{a.t=0;a.play=true}
  a.render()})}
function raStart(){raStop();card.querySelectorAll('.ra').forEach(raInit);if(RA.list.length)RA.raf=requestAnimationFrame(raLoop)}
var sub=0;
function total(){return (cur>=0&&S[cur].steps)||0}
// Reproducció automàtica: al pas actual es reprodueix el vídeo (o, si n'hi ha diversos al mateix pas,
// un darrere l'altre); els vídeos d'altres passos s'aturen.
function playVid(v){
  v.currentTime=0;
  var p=v.play();
  if(p&&p.catch)p.catch(function(){v.muted=true;var q=v.play();if(q&&q.catch)q.catch(function(){})});
}
function syncVideos(){
  var vs=card.querySelectorAll('video'),group=[];
  for(var i=0;i<vs.length;i++){
    var v=vs[i],st=v.closest('[data-step]'),n=st?+st.getAttribute('data-step'):0;
    v.onended=null;
    if(n===sub&&sub>0)group.push(v);else v.pause();
  }
  group.forEach(function(v,i){
    var par=!!v.closest('.eq');
    if(i===0||par)playVid(v);else v.pause();
    if(i<group.length-1&&!par)v.onended=function(){playVid(group[i+1])};
  });
}
function stopVideos(){
  var vs=card.querySelectorAll('video');
  for(var i=0;i<vs.length;i++){vs[i].onended=null;vs[i].pause()}
}
function applySub(){
  var els=card.querySelectorAll('[data-step]');
  for(var i=0;i<els.length;i++){els[i].classList.toggle('on',+els[i].getAttribute('data-step')<=sub)}
  syncVideos();
  showPhoto();
  if(cur===3)raSync();
  var pv=document.getElementById('pv'),nx=document.getElementById('nx');
  if(pv)pv.disabled=(cur===0&&sub===0);
  if(nx)nx.disabled=(cur===S.length-1&&sub>=total());
}
function showField(){
  var f=card.querySelector('.pf');
  
}
function goNext(){
  if(cur<0)return;
  if(sub<total()){sub++;applySub();showField();var nm=card.querySelector('.rv[data-step="'+sub+'"]');}else if(cur<S.length-1)openS(cur+1)
}
function goPrev(){
  if(cur<0)return;
  if(sub>0){sub--;applySub();showField()}else if(cur>0)openS(cur-1,S[cur-1].steps||0)
}
function closeS(){stopVideos();raStop();stage.classList.remove('open');world.style.transform='none';cur=-1;
  sts.forEach(function(b){b.classList.remove('cur')});swapTitle(TITLE0,450)}
document.getElementById('ttl').onclick=function(){if(cur>=0)closeS();else openS(0)};
addEventListener('resize',function(){if(cur>=0)place(cur)});
document.getElementById('go').onclick=function(){openS(0)};
document.getElementById('shade').onclick=closeS;
document.getElementById('panel').onclick=function(e){if(e.target.id==='panel')closeS()};
document.addEventListener('keydown',function(e){
  var nxt=e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown',prv=e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp';
  if(cur<0){
    // Des del camp, "següent" obre la primera fitxa (si la portada ja ha passat)
    if(nxt&&document.body.classList.contains('started')){e.preventDefault();openS(0)}
    return;
  }
  if(e.key==='Escape')closeS();
  if(nxt){e.preventDefault();goNext()}
  if(prv){e.preventDefault();goPrev()}
});

// Portada: al fer clic (o Enter/Espai) fa zoom i deixa veure el camp
(function(){
  var intro=document.getElementById('intro'),stage=document.getElementById('stage');
  stage.setAttribute('inert','');
  var done=false;
  function start(){
    if(done)return;done=true;
    stage.removeAttribute('inert');
    intro.classList.add('out');
    document.body.classList.add('started');
    setTimeout(function(){intro.remove()},1500);
  }
  intro.addEventListener('click',start);
  intro.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){e.preventDefault();start()}});
  // També es pot començar amb la tecla "següent" (fletxa dreta/avall, AvPàg, comandament de presentació)
  document.addEventListener('keydown',function(e){if(!done&&(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown')){e.preventDefault();start()}});
  intro.focus();
})();
